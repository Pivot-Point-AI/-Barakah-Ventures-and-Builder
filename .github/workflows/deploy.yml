name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Load deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Resolve deploy settings
        run: |
          echo "SSH_PORT=${SSH_PORT:-22}" >> "$GITHUB_ENV"
          echo "DEPLOY_PATH=${DEPLOY_PATH:-/opt/barakah-ventures}" >> "$GITHUB_ENV"

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Sync repo to server
        run: |
          rsync -az --delete \
            -e "ssh -p $SSH_PORT" \
            --exclude='.git' --exclude='.github' --exclude='.claude' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH"

      - name: Build and restart containers
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd '$DEPLOY_PATH' && docker compose up -d --build && docker image prune -f"
